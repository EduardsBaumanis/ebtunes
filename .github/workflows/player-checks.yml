name: Player checks
on:
  pull_request:
    paths:
      - 'apps/player/**'
      - 'collections/**'
      - 'tools/build-*.mjs'
      - 'tests/player/**'
      - 'playwright.config.mjs'
      - 'package*.json'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:player
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: player-test-results
          path: test-results/
